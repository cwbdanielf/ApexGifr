[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexgifr"
version = "0.1.0"
description = "Animated GIF generator for SteelSeries Apex OLED displays"
readme = "README.md"
authors = [{name = "ApexGifr Contributors"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
web = [
    "Flask>=3.0.0",
]
dev = [
    "pytest>=7.0",
    "Flask>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/danielpucwb/ApexGifr"
Source = "https://github.com/danielpucwb/ApexGifr"

[project.scripts]
apexgifr-web = "apexgifr.web:main"

[tool.setuptools.package-data]
apexgifr = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
